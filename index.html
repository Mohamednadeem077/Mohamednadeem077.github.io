<!DOCTYPE html>
<html lang="ta">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TamilHot 18+ • 1200+ Videos</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        body { font-family: system-ui, sans-serif; }
        .card { transition: all 0.3s ease; }
        .card:hover { transform: scale(1.03); box-shadow: 0 10px 15px -3px rgb(0 0 0 / 0.3); }
        .modal { animation: fadeIn 0.2s ease; }
    </style>
</head>
<body class="bg-zinc-950 text-white">

    <!-- Navbar -->
    <nav class="bg-black border-b border-red-900 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 py-4 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <span class="text-4xl">🔥</span>
                <span class="text-3xl font-bold text-red-500">TamilHot</span>
                <span class="text-sm bg-red-600 px-2 py-0.5 rounded">18+</span>
            </div>
            <div class="flex items-center gap-4">
                <input id="search" type="text" placeholder="தேடுங்கள்... Tamil Sex Videos" 
                       class="bg-zinc-900 border border-zinc-700 px-5 py-2 rounded-full w-80 focus:outline-none focus:border-red-500">
            </div>
        </div>
    </nav>

    <div class="max-w-7xl mx-auto px-4 py-8">
        <h1 class="text-5xl font-bold text-center mb-2">தமிழ் All Collections Sex Videos</h1>
        <p class="text-center text-red-400 text-xl mb-8">1200+ Full Nude & Real Sex Videos</p>

        <!-- Grid -->
        <div id="grid" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5 gap-4"></div>
    </div>

    <!-- Modal -->
    <div id="modal" class="hidden fixed inset-0 bg-black/90 flex items-center justify-center z-[100]">
        <div class="bg-zinc-900 rounded-2xl max-w-2xl w-full mx-4 overflow-hidden">
            <div class="p-6">
                <div class="flex justify-between items-center mb-4">
                    <h3 id="modalTitle" class="text-2xl font-bold"></h3>
                    <button onclick="closeModal()" class="text-3xl hover:text-red-500">&times;</button>
                </div>
                
                <div class="bg-black aspect-video flex items-center justify-center mb-4 rounded-xl">
                    <div class="text-center">
                        <i class="fas fa-play text-6xl text-red-500 mb-3"></i>
                        <p class="text-lg">Video Placeholder</p>
                        <p class="text-sm text-zinc-400 mt-1">Real video link add செய்யுங்கள் (external hosting)</p>
                    </div>
                </div>

                <div class="flex gap-3">
                    <button onclick="alert('Download link add செய்யுங்கள்')" 
                            class="flex-1 bg-red-600 hover:bg-red-700 py-3 rounded-xl font-semibold">
                        <i class="fas fa-download mr-2"></i> Download
                    </button>
                    <button onclick="closeModal()" 
                            class="flex-1 bg-zinc-700 hover:bg-zinc-600 py-3 rounded-xl font-semibold">
                        Close
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // 1200+ Videos Data
        const videos = [];
        const categories = ["Couple", "Solo", "Lesbian", "Hardcore", "Real Couple"];
        
        for (let i = 1; i <= 1200; i++) {
            const cat = categories[i % categories.length];
            videos.push({
                id: i,
                title: `தமிழ் ${cat} Full Nude Sex Video ${i}`,
                duration: `\( {Math.floor(Math.random() * 8) + 5}: \){String(Math.floor(Math.random() * 60)).padStart(2, '0')}`,
                views: (Math.floor(Math.random() * 850) + 120) + "K",
                thumb: `https://picsum.photos/id/${(i % 200) + 20}/300/200`,
                category: cat
            });
        }

        function render(filteredVideos) {
            const grid = document.getElementById('grid');
            grid.innerHTML = '';
            
            filteredVideos.forEach(video => {
                const card = document.createElement('div');
                card.className = `card bg-zinc-900 rounded-2xl overflow-hidden cursor-pointer border border-zinc-800`;
                card.innerHTML = `
                    <div class="relative">
                        <img src="${video.thumb}" class="w-full aspect-video object-cover">
                        <div class="absolute bottom-2 right-2 bg-black/80 text-xs px-2 py-0.5 rounded">
                            ${video.duration}
                        </div>
                        <div class="absolute top-2 left-2 bg-red-600 text-xs px-2 py-0.5 rounded font-bold">
                            ${video.category}
                        </div>
                    </div>
                    <div class="p-3">
                        <h3 class="font-semibold text-sm line-clamp-2 mb-1">${video.title}</h3>
                        <div class="flex justify-between text-xs text-zinc-400">
                            <span><i class="fas fa-eye mr-1"></i>${video.views}</span>
                        </div>
                    </div>
                `;
                
                card.onclick = () => showModal(video);
                grid.appendChild(card);
            });
        }

        function showModal(video) {
            document.getElementById('modalTitle').innerText = video.title;
            document.getElementById('modal').classList.remove('hidden');
            document.getElementById('modal').classList.add('flex');
        }

        function closeModal() {
            const modal = document.getElementById('modal');
            modal.classList.remove('flex');
            modal.classList.add('hidden');
        }

        // Search
        document.getElementById('search').addEventListener('input', (e) => {
            const term = e.target.value.toLowerCase();
            const filtered = videos.filter(v => v.title.toLowerCase().includes(term));
            render(filtered);
        });

        // Initial render
        window.onload = () => {
            render(videos);
        };
    </script>
</body>
</html>
